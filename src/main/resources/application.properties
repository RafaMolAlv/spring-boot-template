spring.application.name=atm-api

# Base de datos en memoria (suficiente para la prueba; en producción sería Oracle/PostgreSQL)
spring.datasource.url=jdbc:h2:mem:atmdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.h2.console.enabled=true

# Configuración del banco
# Código de entidad de nuestro banco (posiciones 5-8 del IBAN español)
bank.code=9000
# Comisión por transferencia a otra entidad
bank.external-transfer-fee=1.50
